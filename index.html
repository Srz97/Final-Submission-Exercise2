<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <!-- Load Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!--  The favicon -->
    <link rel="icon" type="image/png" href="assets/images/favicon.png?v=2">
    
    <title>Book Catalogue</title>
</head>
<body>
    <header>
        <h1>Book Catalogue</h1>

            <nav>
              <a href="#home">Home</a>
              <a href="#catalogue">Books</a>
            </nav>
    </header>

    <main>
        <section id="home">
          <h2>Discover your next favourite book</h2>

             <p>Explore our catalogue and find something you would love to read.</p>

               <a href="#catalogue">Explore books</a>
        </section>
   

        <section id="catalogue">
            <h2>Our books</h2>

                <label for="category-filter">Choose a category:</label>

                    <select id="category-filter">
                      <option value="all">All categories</option>
                      <option value="Fantasy">Fantasy</option>
                      <option value="Self-development">Self-development</option>
                      <option value="Finance">Finance</option>
                      <option value="Programming">Programming</option>
                      <option value="Fiction">Fiction</option>
                      <option value="Other">Other</option>
                    </select>

                        <div id="book-list"></div>
        </section>

        <section id="add-book">
            <h2>Help our library grow</h2>
            <p>Have a favourite book? Add your recommendation and inspire someone’s next read.</p>

             <form id="book-form">
               <label for="book-title">Book title</label>
               <input type="text" id="book-title" required>

                <label for="book-author">Author</label>
                <input type="text" id="book-author" required>

                <label for="book-category">Category</label>

                <select id="book-category" required>
                  <option value="">Choose a category</option>
                  <option value="Fantasy">Fantasy</option>
                  <option value="Self-development">Self-development</option>
                  <option value="Finance">Finance</option>
                  <option value="Programming">Programming</option>
                  <option value="Fiction">Fiction</option>
                  <option value="Other">Other</option>
                </select>

                <label for="book-description">Description</label>
                    <textarea id="book-description" rows="4" required></textarea>
           
               <button type="submit">Share your book</button>
            </form>
        </section>

     </main>
